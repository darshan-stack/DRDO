experiment:
  name: ffem_demo
  seed: 7
  frames: 100
  enable_rerun: true
  output_recording: outputs/ffem_demo.rrd

sensor:
  frame_rate_hz: 10
  max_range_m: 80.0
  horizontal_resolution_m: 0.50
  vertical_resolution_m: 0.25

mapping:
  base_cell_size_m: 0.50
  finest_cell_size_m: 0.05
  radial_bands_m: [0.0, 8.0, 18.0, 40.0, 100.0]
  radial_cell_sizes_m: [0.05, 0.10, 0.25, 0.50]
  max_level: 2
  hierarchy: explicit_4ary
  min_observations_for_slice: 8
  slice_separation_m: 0.35
  elevation_variance_limit: 0.25

adaptation:
  mode: ffem_feedback
  semantic_weight: 0.27
  motion_weight: 0.27
  traversability_weight: 0.18
  geometry_weight: 0.13
  range_weight: 0.05
  planning_weight: 0.10
  refine_threshold: 0.60
  merge_threshold: 0.25
  dwell_frames: 5
  max_topology_changes_per_frame: 32
  max_active_cells: 20000
  predictive_dilation_frames: 2

perception:
  backend: torch_range
  checkpoint: models/checkpoints/semanticposs_range_model.pt
  num_classes: 7
  range_height: 32
  range_width: 1024
  fov_up_deg: 10.0
  fov_down_deg: -30.0
  max_range_m: 80.0
  motion_voxel_m: 0.35
  motion_threshold_m: 0.45

planning:
  mode: risk_aware_local
  lookahead_m: 18.0
  lateral_limit_m: 4.0
  lateral_step_m: 0.5
  feedback_into_mapping: true

visualization:
  application_id: ffem-lidar-mapping
  log_raw_points: true
  log_semantics: true
  log_dynamics: true
  log_elevation: true
  log_adaptive_cells: true
  log_planning_path: true
  log_metrics: true
