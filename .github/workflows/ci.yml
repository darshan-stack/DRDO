name: CI

on:
  push:
    branches: [main, production-ready-ffem]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall -q src scripts tests
      - name: Ruff
        run: ruff check src scripts tests
      - name: Unit tests
        run: pytest -q
