[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffem-lidar-mapping"
version = "0.1.0"
description = "Research scaffold for adaptive variable-resolution 2.5D LiDAR mapping"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyyaml>=6.0", "rerun-sdk>=0.22"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
